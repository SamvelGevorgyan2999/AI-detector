[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "origincheck"
version = "1.0.0"
description = "Desktop AI-content detector for JPG images and PDF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "pypdfium2>=4.30",
]

[project.scripts]
origincheck = "origincheck.app:main"

[tool.setuptools.packages.find]
include = ["origincheck*"]


